appId: com.ava-supernova.ide
productName: "Ava Supernova"
copyright: "Copyright 2026 Augmented Value Acceleration"

directories:
  output: dist

# Webpack bundles everything — skip npm prune/rebuild
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

# Only include webpack output + package.json (node_modules not needed)
files:
  - package.json
  - lib/**
  - "!node_modules"

# Native .node modules and binaries must be outside asar to load
asarUnpack:
  - "lib/backend/native/**"

# Plugins bundled with the app
extraResources:
  - from: ../../plugins
    to: plugins
    filter:
      - "**/*"
  # @ava/core — single-file ESM bundle for runtime dynamic import
  - from: resources/ava-core.mjs
    to: ava-core.mjs

# ——— Windows ———
# Code signing: Set CSC_LINK (path/URL to .pfx cert) and CSC_KEY_PASSWORD in CI secrets.
# For EV certificates, use Windows Sign Tool via signtool.exe (signAndEditExecutable: true).
# Set CSC_IDENTITY_AUTO_DISCOVERY=false to skip signing during local dev builds.
win:
  icon: resources/icon.ico
  signingHashAlgorithms:
    - sha256
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  differentialPackage: false
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerSidebar: resources/installer-sidebar.bmp
  uninstallerSidebar: resources/installer-sidebar.bmp
  installerHeader: resources/installer-header.bmp
  shortcutName: "Ava Supernova"

# ——— macOS ———
# Code signing: Set CSC_LINK and CSC_KEY_PASSWORD in CI secrets.
# Notarization: Set APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID.
# electron-builder handles notarization automatically when these are set.
mac:
  icon: resources/icon.png
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - x64
        - arm64

# ——— Linux ———
linux:
  icon: resources/icon.png
  category: Development
  target:
    - AppImage
    - deb

# Auto-update via GitHub Releases
publish:
  provider: github
  owner: AugmentedValueAcceleration
  repo: ava-supernova-ide
