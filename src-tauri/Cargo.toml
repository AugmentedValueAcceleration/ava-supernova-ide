[package]
name = "ava-supernova-ide"
version = "0.1.0"
description = "Ava | Supernova IDE — AI-native code editor"
authors = ["Augmented Value Acceleration"]
edition = "2021"

[lib]
name = "ava_supernova_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
