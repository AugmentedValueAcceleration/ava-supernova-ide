[package]
name = "ava-supernova-ide"
version = "0.13.0"
description = "Ava | Supernova IDE — AI-native code editor"
authors = ["Augmented Value Acceleration"]
edition = "2021"

[lib]
name = "ava_supernova_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Forwarded from `tauri dev --features devtools`. tray-icon is always on
# because the tray is a first-class runtime feature (Phase B5).
devtools = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
keyring = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
screenshots = "0.8"
enigo = { version = "0.2", features = ["serde"] }


[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_Graphics_Gdi"] }
uiautomation = "0.24"
