[package]
name = "ava-supernova-ide"
version = "0.41.1"
description = "Ava Supernova IDE — AI-native code editor"
authors = ["Augmented Value Acceleration"]
edition = "2021"

[lib]
name = "ava_supernova_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Forwarded from `tauri dev --features devtools`. tray-icon is always on
# because the tray is a first-class runtime feature (Phase B5).
devtools = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2"
# single-instance: required so an OS-dispatched ava-ide:// URL re-uses the
# already-running IDE process instead of spawning a sibling. Without this,
# the OAuth callback URL launches a fresh IDE whose React app has no
# pendingRef — the original instance sits forever waiting for a signal
# that went to its duplicate.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
keyring = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
screenshots = "0.8"
enigo = { version = "0.2", features = ["serde"] }
# Workspace search — `ignore` walks directories respecting .gitignore/
# .ignore (the same engine ripgrep uses), `regex` matches inside files.
# Avoids depending on a system-installed ripgrep binary which most
# users won't have.
ignore = "0.4"
regex = "1"


[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_Graphics_Gdi"] }
uiautomation = "0.24"
